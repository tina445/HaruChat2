workflows:
  apple-native-artifact:
    name: Apple native XCFramework
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: Build unsigned LlmCore XCFramework
        script: bash scripts/build-apple-xcframework.sh
    artifacts:
      - artifacts/apple/LlmCore.xcframework.zip
      - artifacts/apple/LlmCore.xcframework.zip.sha256
      - artifacts/apple/build-manifest.txt
